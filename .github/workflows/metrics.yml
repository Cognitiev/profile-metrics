name: Generate Metrics Dashboard

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Card 1 — Identity header + language breakdown
      - name: Generate metrics-overview.svg
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: classic PAT from crypticatul with repo + read:user scopes
          # (required to count private repositories).
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: crypticatul
          filename: metrics-overview.svg
          committer_branch: main
          base: header
          repositories_affiliations: owner, collaborator
          config_timezone: Asia/Kolkata
          config_octicon: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used

      # Card 2 — Contribution volume + full-year isometric commit calendar
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: crypticatul
          filename: github-metrics.svg
          committer_branch: main
          base: activity
          repositories_affiliations: owner, collaborator
          config_timezone: Asia/Kolkata
          config_octicon: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
